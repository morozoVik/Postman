name: Deploy to Production

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: postman_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports: ["6379:6379"]

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt

    - name: Create test database
      env:
        PGPASSWORD: postgres
      run: |
        psql -h localhost -U postgres -c "CREATE DATABASE postman_test;"
        psql -h localhost -U postgres -c "GRANT ALL PRIVILEGES ON DATABASE postman_test TO postgres;"

    - name: Run migrations
      env:
        SECRET_KEY: test-secret-key-for-ci-12345
        DEBUG: 'True'
        POSTGRES_DB: postman_test
        POSTGRES_USER: postgres
        POSTGRES_PASSWORD: postgres
        POSTGRES_HOST: localhost
        POSTGRES_PORT: 5432
        DJANGO_SETTINGS_MODULE: config.settings
      run: |
        python manage.py migrate --noinput
        echo "Миграции выполнены успешно!"

    - name: Run tests
      env:
        SECRET_KEY: ${{ secrets.TEST_SECRET_KEY }}
        DEBUG: 'True'
        DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postman_test
        DJANGO_SETTINGS_MODULE: config.settings
        CELERY_BROKER_URL: redis://localhost:6379/0
      run: |
        python manage.py test --verbosity=2
        
        echo "Тесты успешно пройдены!"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - uses: actions/checkout@v4

    - name: Deploy to Server
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.SERVER_IP }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        script: |
          echo "Начинаем деплой на сервер..."
          
          cd ${{ secrets.DEPLOY_DIR }}
          
          echo "Останавливаем текущие контейнеры..."
          docker compose down 2>/dev/null || true
          
          echo "Получаем последние изменения..."
          git fetch origin main
          git reset --hard origin/main
          
          echo "Перестраиваем контейнеры..."
          docker compose build --no-cache
          
          echo "Запускаем контейнеры..."
          docker compose up -d
          
          echo "Ждем запуска приложения..."
          sleep 15
          
          echo "Проверяем health check..."

          for i in {1..5}; do
            if curl -f http://localhost:8000/api/health/ > /dev/null 2>&1; then
              echo "Приложение запущено успешно!"
              break
            fi
            echo "Попытка $i/5..."
            sleep 5
          done
          
          # Финальная проверка
          if curl -f http://localhost:8000/api/health/; then
            echo "Деплой завершен успешно!"
            echo "Приложение доступно по: http://${{ secrets.SERVER_IP }}:8000"
          else
            echo "Health check не прошел!"
            echo "Логи контейнера backend:"
            docker compose logs backend --tail=50
            exit 1
          fi